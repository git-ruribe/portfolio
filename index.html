            --bg: #050505;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --accent: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- Scrollbar Customization --- */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* --- Background Effects --- */
        .glow {
            position: fixed;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            top: -10vw;
            right: -10vw;
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .glow-2 {
            position: fixed;
            width: 30vw;
            height: 30vw;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
            bottom: -5vw;
            left: -5vw;
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        /* --- Header --- */
        header {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* --- Hero --- */
        .hero {
            padding: 6rem 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2.5rem;
        }

        /* --- Filters --- */
        .filters {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            padding: 0 1rem;
        }

        .filter-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .filter-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .filter-btn.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        /* --- Search Bar --- */
        .search-container {
            max-width: 800px;
            margin: 0 auto 3rem;
            position: relative;
            padding: 0 1rem;
        }

        #search-bar {
            width: 100%;
            padding: 1.2rem 1.5rem;
            font-size: 1.1rem;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        #search-bar:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: var(--surface-hover);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* --- Blog Feed --- */
        .project-feed {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem 8rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .blog-post {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        /* --- Gallery Styles --- */
        .post-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.75rem;
            margin: 1.5rem 0;
            border-radius: 12px;
            overflow: hidden;
        }

        .gallery-item {
            aspect-ratio: 16/9;
            background: var(--surface);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
            position: relative;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            z-index: 2;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.65rem;
            padding: 4px 8px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .gallery-caption {
            opacity: 1;
        }

        .tech-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0 1rem 0;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--border);

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .meta-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .meta-value {
            font-size: 0.85rem;
            color: var(--text);
            font-weight: 500;
        }

        .meta-value.location {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: #a855f7;
        }

        .meta-value.tech-tags {

            flex-wrap: wrap;
            gap: 0.4rem;
        }

            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            border: 1px solid rgba(99, 102, 241, 0.2);

        .blog-post:hover {
            transform: translateY(-4px);
            background: var(--surface-hover);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.2rem;
        }

        .post-icon {
            font-size: 2.2rem;
            background: var(--surface);

            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            border: 1px solid var(--border);

            font-weight: 700;
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }

        .post-tags {

            gap: 0.5rem;

        .tag.status-public {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        .tag.status-proto,
        .tag.status-prototype,
        .tag.status-experiment {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
        }

        .tag.status-private,
        .tag.status-archived {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
        }

        .tag.status-exploration,
        .tag.status-concept {
            background: rgba(168, 85, 247, 0.1);
            color: #c084fc;
        }

        .post-content {
            color: #cbd5e1;
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

            display: inline-block;
            color: #a855f7;
            font-weight: 600;
            font-size: 0.95rem;

        }

            padding: 4rem 2rem;
            text-align: center;
            border-top: 1px solid var(--border);

            margin: 0 auto;

        .copyright {

            font-size: 0.9rem;
        }

        /* --- Animations --- */

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.8s ease forwards;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            header {
                padding: 1.5rem;
            }

            .hero {
                padding: 4rem 1.5rem 3rem;
            }

            .project-grid {
                grid-template-columns: 1fr;
                padding: 0 1.5rem 5rem;
            }
        }
    </style>
</head>

        const container = document.getElementById('project-container');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const searchBar = document.getElementById('search-bar');


        let allProjects = [...staticProjects];
        let currentCategory = 'all';

        // --- Render Function (BLOG FORMAT) ---
        function renderProjects() {
            container.innerHTML = '';

            // Filtering logic

            const searchTerm = searchBar.value.toLowerCase().trim();

            const filtered = allProjects.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.category === currentCategory;

                const matchesSearch = searchTerm === '' ||
                    (p.name && p.name.toLowerCase().includes(searchTerm)) ||
                    (p.description && p.description.toLowerCase().includes(searchTerm)) ||
                    (p.review && p.review.toLowerCase().includes(searchTerm)) ||
                    (p.category && p.category.toLowerCase().includes(searchTerm));

                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8; padding: 2rem;">No se encontraron artículos que coincidan con tu búsqueda.</p>`;
                return;
            }

            filtered.forEach((project, index) => {
                const isClickable = project.url && project.url !== "#";
                const article = document.createElement(isClickable ? 'a' : 'div');
                if (isClickable) article.href = project.url;
                article.className = 'blog-post fade-in';
                if (!isClickable) article.style.cursor = 'default';
                article.style.animationDelay = `${(index % 10) * 0.05}s`;

                const statusClass = `status-${project.status.toLowerCase()}`;

                const reviewText = project.review || project.description || "Proyecto documentado sin reseña extensa.";

                article.innerHTML = `
                    <div class="post-header">
                        <div class="post-icon">${project.icon || '🔥'}</div>
                        <div class="post-title-wrapper">
                            <h3>${project.name}</h3>
                            <div class="post-tags">
                                <span class="tag ${statusClass}">${project.status}</span>
                                <span class="tag">${project.category}</span>
                                ${project.date ? `<span class="tag" style="background:var(--surface); border:1px solid var(--border); color:var(--text-secondary);"><span style="margin-right:4px;">📅</span>${new Date(project.date + 'T00:00:00').toLocaleDateString('es-ES', { month: 'short', year: 'numeric' }).toUpperCase()}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="post-content">
                        <p>${reviewText}</p>
                        
                        ${(project.languages || project.location || project.tech) ? `
                            <div class="tech-meta">
                                ${project.languages ? `
                                    <div class="meta-item">
                                        <span class="meta-label">Lenguajes</span>
                                        <span class="meta-value">${project.languages}</span>
                                    </div>
                                ` : ''}
                                ${project.stats ? `
                                    <div class="meta-item">
                                        <span class="meta-label">Métricas</span>
                                        <span class="meta-value">${project.stats}</span>
                                    </div>
                                ` : ''}
                                ${project.location ? `
                                    <div class="meta-item" style="grid-column: span 2;">
                                        <span class="meta-label">Ubicación</span>
                                        <span class="meta-value location">${project.location}</span>
                                    </div>
                                ` : ''}
                                ${project.tech ? `
                                    <div class="meta-item" style="grid-column: span 2;">
                                        <span class="meta-label">Tecnologías Clave</span>
                                        <div class="meta-value tech-tags">
                                            ${project.tech.map(t => `<span class="tech-pill">${t}</span>`).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}

                        ${project.gallery ? `
                            <div class="post-gallery">
                                ${project.gallery.map(img => `
                                    <div class="gallery-item">
                                        <img src="${img.src}" alt="${img.label}">
                                        <div class="gallery-caption">${img.label}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                    ${isClickable ? '<span class="read-more">Explorar Proyecto &rarr;</span>' : '<span class="read-more" style="opacity:0.5; color:var(--text-muted);">Solo Documentación</span>'}
                `;
                container.appendChild(article);
            });
        }



        // --- Filter Logic ---
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderProjects();
            });
        });

        // --- Search Logic ---
        searchBar.addEventListener('input', () => {
            renderProjects();
        });

        // Init
        allProjects.sort((a, b) => {
            if (!a.date) return 1;
            if (!b.date) return -1;
            return new Date(b.date) - new Date(a.date);
        });
        renderProjects();
    </script>
