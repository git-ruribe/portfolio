```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doble o Nada: El Reto del 1%</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .money-text {
            text-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }

        .btn-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .gradient-border {
            background: linear-gradient(to right, #22c55e, #3b82f6);
            padding: 2px;
            border-radius: 1rem;
        }

        .inner-content {
            background: #1e293b;
            border-radius: 0.9rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="game-container" class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold mb-2 tracking-tight">DOBLE O <span class="text-green-500">NADA</span></h1>
            <p class="text-slate-400 text-sm">El riesgo sube 1% cada vez que pulsas.</p>
        </div>

        <!-- Main Card -->
        <div class="gradient-border shadow-2xl mb-6">
            <div class="inner-content p-8 text-center relative overflow-hidden">
                <!-- Background Decoration -->
                <div id="risk-bg" class="absolute bottom-0 left-0 w-full bg-red-500/10 transition-all duration-500" style="height: 1%;"></div>

                <div class="relative z-10">
                    <p class="text-slate-400 text-xs uppercase tracking-widest mb-1">Balance Actual</p>
                    <div id="balance" class="text-6xl font-black mb-6 money-text transition-all duration-300">$1</div>
                    
                    <div class="flex justify-between items-center bg-slate-900/50 rounded-lg p-4 mb-6">
                        <div class="text-left">
                            <p class="text-slate-400 text-xs">Prob. de Pérdida</p>
                            <p id="risk-percent" class="text-2xl font-bold text-red-400">1%</p>
                        </div>
                        <div class="text-right">
                            <p class="text-slate-400 text-xs">Siguiente Nivel</p>
                            <p id="next-win" class="text-2xl font-bold text-green-400">$2</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="grid grid-cols-1 gap-4">
            <button id="btn-push" class="bg-green-600 hover:bg-green-500 active:scale-95 transition-all py-5 rounded-xl font-bold text-xl shadow-lg btn-pulse flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                PULSAR BOTÓN
            </button>
            <button id="btn-collect" class="bg-slate-700 hover:bg-slate-600 active:scale-95 transition-all py-4 rounded-xl font-semibold text-slate-200">
                Retirarse con $<span id="collect-amount">1</span>
            </button>
        </div>

        <!-- History & Stats -->
        <div class="mt-10 grid grid-cols-2 gap-4">
            <div class="bg-slate-800/50 p-3 rounded-lg text-center border border-slate-700">
                <p class="text-slate-500 text-[10px] uppercase">Récord Personal</p>
                <p id="high-score" class="font-bold text-yellow-500">$0</p>
            </div>
            <div class="bg-slate-800/50 p-3 rounded-lg text-center border border-slate-700">
                <p class="text-slate-500 text-[10px] uppercase">Pulsaciones</p>
                <p id="click-count" class="font-bold text-blue-400">0</p>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-6">
        <div id="modal-content" class="bg-slate-900 border border-slate-700 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <div id="modal-icon" class="mb-4 flex justify-center"></div>
            <h2 id="modal-title" class="text-3xl font-black mb-2">¡GAME OVER!</h2>
            <p id="modal-msg" class="text-slate-400 mb-8">Ese 1% extra fue fatal.</p>
            <button id="btn-restart" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all">JUGAR DE NUEVO</button>
        </div>
    </div>

    <script>
        let balance = 1;
        let risk = 1;
        let clicks = 0;
        let highScore = localStorage.getItem('dobleNada_highScore') || 0;

        const balanceEl = document.getElementById('balance');
        const riskEl = document.getElementById('risk-percent');
        const nextWinEl = document.getElementById('next-win');
        const collectAmountEl = document.getElementById('collect-amount');
        const riskBg = document.getElementById('risk-bg');
        const clickCountEl = document.getElementById('click-count');
        const highScoreEl = document.getElementById('high-score');

        const btnPush = document.getElementById('btn-push');
        const btnCollect = document.getElementById('btn-collect');
        const btnRestart = document.getElementById('btn-restart');

        const modalContainer = document.getElementById('modal-container');
        const modalTitle = document.getElementById('modal-title');
        const modalMsg = document.getElementById('modal-msg');
        const modalIcon = document.getElementById('modal-icon');

        highScoreEl.textContent = `$${formatNumber(highScore)}`;

        function formatNumber(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            return num.toLocaleString();
        }

        function updateUI() {
            balanceEl.textContent = `$${formatNumber(balance)}`;
            riskEl.textContent = `${risk}%`;
            nextWinEl.textContent = `$${formatNumber(balance * 2)}`;
            collectAmountEl.textContent = formatNumber(balance);
            clickCountEl.textContent = clicks;
            riskBg.style.height = `${risk}%`;

            if (risk > 50) {
                riskEl.classList.remove('text-red-400');
                riskEl.classList.add('text-red-600', 'animate-pulse');
            } else {
                riskEl.classList.add('text-red-400');
                riskEl.classList.remove('text-red-600', 'animate-pulse');
            }
        }

        function showModal(type, title, msg) {
            modalTitle.textContent = title;
            modalMsg.textContent = msg;
            
            if (type === 'lose') {
                modalTitle.className = "text-3xl font-black mb-2 text-red-500";
                modalIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
            } else {
                modalTitle.className = "text-3xl font-black mb-2 text-green-500";
                modalIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 10"/></svg>`;
            }

            modalContainer.classList.remove('hidden');
        }

        btnPush.addEventListener('click', () => {
            const roll = Math.random() * 100;
            
            // Animación de feedback
            balanceEl.classList.add('scale-110');
            setTimeout(() => balanceEl.classList.remove('scale-110'), 150);

            if (roll < risk) {
                // Perder
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 500);
                showModal('lose', '¡LO PERDISTE TODO!', `Tenías un ${risk}% de probabilidad de perder y ha ocurrido en el intento #${clicks + 1}.`);
                resetGame(false);
            } else {
                // Ganar
                balance *= 2;
                risk++;
                clicks++;
                updateUI();
            }
        });

        btnCollect.addEventListener('click', () => {
            if (balance > highScore) {
                highScore = balance;
                localStorage.setItem('dobleNada_highScore', highScore);
                highScoreEl.textContent = `$${formatNumber(highScore)}`;
            }
            showModal('win', '¡TE HAS RETIRADO!', `Has decidido no arriesgar más. Te llevas $${formatNumber(balance)} tras ${clicks} pulsaciones.`);
            resetGame(false);
        });

        btnRestart.addEventListener('click', () => {
            modalContainer.classList.add('hidden');
            resetGame(true);
        });

        function resetGame(fullReset) {
            if (fullReset) {
                balance = 1;
                risk = 1;
                clicks = 0;
                updateUI();
            }
        }

        // Init
        updateUI();

    </script>
</body>
</html>

```
